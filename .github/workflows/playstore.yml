name: Deploy Play Store

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: playstore-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Restore private config files
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          printf '%s\n' "$ENV_FILE" > .env
          printf '%s\n' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          printf '%s\n' "$FIREBASE_OPTIONS_DART" > lib/firebase_options.dart

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=upload-keystore.jks\n'
          } > android/key.properties

      - run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build AAB
        run: flutter build appbundle --release --build-number=$((GITHUB_RUN_NUMBER + 100))

      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.estudazz
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: production
          status: completed
